name: Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 1.2.18); leave empty to read Cargo.toml'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deb and rpm packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate requested version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(awk -F '"' '/^version = / { print $2; exit }' crates/panel/Cargo.toml)"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a stable semver such as 1.2.18"
            exit 1
          fi
          CARGO_VERSION="$(awk -F '"' '/^version = / { print $2; exit }' crates/panel/Cargo.toml)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::requested/tag version ($VERSION) does not match crates/panel/Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev rpm
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-linux-packages.sh

      - name: Inspect packages
        run: |
          dpkg-deb --info dist/packages/*.deb
          rpm -qip dist/packages/*.rpm
          sha256sum -c dist/packages/SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: relay-panel-linux-packages-${{ github.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 30
