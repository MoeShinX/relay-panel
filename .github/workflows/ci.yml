name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + lint + build + e2e
    runs-on: ubuntu-latest

    # v0.4.3 PR2: PostgreSQL service for the PgRepository contract tests.
    # The tests gate on TEST_PG_URL — when present, the pg_repo::tests module
    # runs against this service; when absent (local dev) it skips. health check
    # waits for PG to accept connections before cargo test starts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaytest
          POSTGRES_PASSWORD: relaytest
          POSTGRES_DB: relaytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_URL: postgres://relaytest:relaytest@localhost:5432/relaytest
      # Same C baseline as the release builds, so the old-CPU smoke below
      # tests what ships. Read by the cc crate (bundled SQLite, ring).
      CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
      CXXFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: repo test parity
        run: bash scripts/check-repo-test-parity.sh

      - name: cargo build (debug, for e2e)
        run: cargo build

      # Release binaries are built on GitHub's runners, whose C compiler may
      # target a newer x86-64 level than older servers support (panel 1.2.23
      # to 1.3.2 crashed with "invalid opcode" on CPUs without AVX2). Start
      # both binaries on an emulated CPU without AVX so that cannot ship again.
      # They run inside debian:bookworm-slim, the panel image's base: the
      # runner's own glibc may itself need a newer CPU.
      - name: old-CPU smoke setup (gdb, to name a crash site)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb

      # TEMP calibration (remove before merge): 1.2.22 runs on an Ivy Bridge
      # host, 1.2.23 does not. The check must pass the first and fail the second.
      - name: TEMP old-CPU calibration against published images
        continue-on-error: true
        run: |
          for v in 1.2.22 1.2.23; do
            id=$(docker create ghcr.io/moeshinx/relay-panel-panel:$v-amd64)
            docker cp "$id:/app/relay-panel" "/tmp/relay-panel-$v"
            docker rm "$id" >/dev/null
            for cpu in Nehalem IvyBridge; do
              echo "===== published $v on $cpu ====="
              OLD_CPU=$cpu bash scripts/old-cpu-smoke.sh panel "/tmp/relay-panel-$v" && echo "RESULT $v $cpu: PASSED" || echo "RESULT $v $cpu: FAILED"
            done
          done
          for v in 1.2.12 1.3.1; do
            curl -fsSL -o "/tmp/relay-node-$v" "https://github.com/MoeShinX/relay-panel/releases/download/node-v$v/relay-node-linux-amd64"
            chmod +x "/tmp/relay-node-$v"
            echo "===== published node $v on Nehalem ====="
            bash scripts/old-cpu-smoke.sh node "/tmp/relay-node-$v" && echo "RESULT node $v: PASSED" || echo "RESULT node $v: FAILED"
          done

      # Panel only: the debug node here links the runner's newer glibc and
      # cannot start inside bookworm at all. The released node is a static
      # musl binary; node-release.yml checks that one.
      - name: old-CPU smoke (emulated Nehalem, no AVX)
        run: bash scripts/old-cpu-smoke.sh panel target/debug/relay-panel

      - name: npm ci (frontend)
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Clear TypeScript cache
        run: rm -f tsconfig.tsbuildinfo .tsbuildinfo
        working-directory: frontend

      - name: npm run typecheck (frontend)
        run: npm run typecheck
        working-directory: frontend

      - name: npm run lint (frontend)
        run: npm run lint
        working-directory: frontend

      - name: npm run test (frontend)
        run: npm run test
        working-directory: frontend

      - name: npm run build (frontend)
        run: npm run build
        working-directory: frontend

      # The panel's CSP allows fonts only from 'self', so a font inlined as a
      # data: URI is refused by the browser (see vite.config.ts).
      - name: no font inlined into the built CSS
        run: |
          if grep -l "data:font" dist/assets/*.css; then
            echo "::error::a font was inlined as a data: URI, which the panel's CSP blocks"
            exit 1
          fi
        working-directory: frontend

      - name: e2e test
        run: python3 tests/e2e_test.py
